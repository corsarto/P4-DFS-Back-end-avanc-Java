<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interface simple pour gérer des projets EcoReno" />
    <title>EcoReno</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f8f5;
        --panel: #ffffff;
        --text: #163126;
        --muted: #5f7a6d;
        --accent: #2f7d5b;
        --accent-dark: #215c43;
        --border: #dbe8e0;
        --error: #a11b00;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;
      }
      header {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(22,49,38,0.06);
      }
      h1 { margin: 0 0 8px; }
      p { margin: 0; color: var(--muted); }
      .grid {
        display: grid;
        gap: 24px;
        grid-template-columns: 1.1fr 0.9fr;
        margin-top: 24px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
      }
      form { display: grid; gap: 12px; }
      label { font-weight: 600; }
      input, select, textarea, button {
        width: 100%;
        font: inherit;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
      }
      button {
        background: var(--accent);
        color: white;
        border: none;
        cursor: pointer;
      }
      button:hover { background: var(--accent-dark); }
      .project-list { display: grid; gap: 12px; }
      .project-item {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        background: #fbfdfb;
      }
      .msg-error { color: var(--error); }
      .msg-error:not(:empty)::before { content: "Erreur : "; }
      input[aria-invalid="true"] { border-color: var(--error); }
      .muted { color: var(--muted); font-size: 0.95rem; }
      @media (max-width: 760px) {
        .grid { grid-template-columns: 1fr; }
        .page { padding: 16px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <h1>EcoReno</h1>
        <p>Suivez vos projets de rénovation écologique avec une interface simple et accessible.</p>
      </header>

      <section class="grid" aria-label="Gestion des projets">
        <div class="card">
          <h2>Créer un projet</h2>
          <form id="project-form" novalidate>
            <label for="name">Nom du projet</label>
            <input id="name" name="name" aria-describedby="name-error" required />
            <p id="name-error" class="msg-error" aria-live="polite"></p>

            <label for="owner">Nom du client</label>
            <input id="owner" name="owner" aria-describedby="owner-error" required />
            <p id="owner-error" class="msg-error" aria-live="polite"></p>

            <label for="budget">Budget</label>
            <input id="budget" name="budget" type="number" aria-describedby="budget-error" required min="1" />
            <p id="budget-error" class="msg-error" aria-live="polite"></p>

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3"></textarea>

            <label for="status">Statut</label>
            <select id="status" name="status">
              <option value="PLANNED">Planifié</option>
              <option value="IN_PROGRESS">En cours</option>
              <option value="COMPLETED">Terminé</option>
            </select>

            <button type="submit">Ajouter</button>
          </form>
        </div>

        <div class="card">
          <h2>Projets récents</h2>
          <div id="project-list" class="project-list" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <script>
      const list = document.getElementById('project-list');
      const form = document.getElementById('project-form');

      async function loadProjects() {
        const response = await fetch('/api/projects');
        const projects = await response.json();
        list.innerHTML = '';

        if (!projects.length) {
          list.innerHTML = '<p class="muted">Aucun projet pour le moment.</p>';
          return;
        }

        projects.forEach((project) => {
          const item = document.createElement('article');
          item.className = 'project-item';

          const title = document.createElement('h3');
          title.textContent = project.name;
          item.appendChild(title);

          const owner = document.createElement('p');
          owner.textContent = 'Client : ' + project.owner;
          owner.className = 'muted';
          item.appendChild(owner);

          const budget = document.createElement('p');
          budget.textContent = 'Budget : ' + project.budget + ' €';
          item.appendChild(budget);

          const description = document.createElement('p');
          description.textContent = 'Description : ' + (project.description || 'À compléter');
          item.appendChild(description);

          const status = document.createElement('p');
          status.textContent = 'Statut : ' + (project.status || 'PLANNED');
          item.appendChild(status);
          list.appendChild(item);
        });
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        form.querySelectorAll('.msg-error').forEach((p) => { p.textContent = ''; });
        form.querySelectorAll('[aria-invalid]').forEach((input) => {
          input.removeAttribute('aria-invalid');
        });
        const payload = Object.fromEntries(new FormData(form).entries());
        payload.budget = (payload.budget === '') ? null : Number(payload.budget);

        const response = await fetch('/api/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          form.reset();
          loadProjects();
        } else {
          const errors = await response.json();
          for (const [field, message] of Object.entries(errors)) {
            document.getElementById(field + '-error').textContent = message;
            document.getElementById(field).setAttribute('aria-invalid', 'true');
          }
        }
      });

      loadProjects();
    </script>
  </body>
</html>
